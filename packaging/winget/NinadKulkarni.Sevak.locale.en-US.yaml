ShortDescription: Keyboard-first quick launcher for apps, calculations, web and file search.
Description: |-
  Sevak is an open-source quick launcher. Press a hotkey, type a few letters, and launch apps,
  do quick math, search the web or find files. Results are ranked by how often and how recently
  you use them. It runs entirely on your machine with no telemetry and is configured from one
  TOML file.
