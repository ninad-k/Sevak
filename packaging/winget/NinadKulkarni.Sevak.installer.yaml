# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.9.0.schema.json
PackageIdentifier: NinadKulkarni.Sevak
PackageVersion: {{version}}
InstallerType: nullsoft
Scope: user
InstallModes:
  - silent
  - silentWithProgress
UpgradeBehavior: install
ReleaseDate: {{date}}
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/ninad-k/Sevak/releases/download/v{{version}}/{{file:nsis}}
    InstallerSha256: {{SHA256:nsis}}
    # The NSIS installer's Add/Remove Programs key (...\Uninstall\Sevak): in HKCU for
    # the per-user install that /S makes by default, in HKLM with /ALLUSERS. Scope:
    # user needs no switch; a silent install stays in the scope of a copy that is
    # already installed (see docs/install.md).
    ProductCode: Sevak
ManifestType: installer
ManifestVersion: 1.9.0
