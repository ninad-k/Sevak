[package]
name = "sevak"
description = "Sevak: a keyboard-first quick launcher."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[build-dependencies]
tauri-build.workspace = true

[dependencies]
sevak-core.workspace = true
sevak-platform.workspace = true
sevak-plugins.workspace = true

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
# macos-private-api: a transparent window on macOS (app.macOSPrivateApi).
tauri = { workspace = true, features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-global-shortcut.workspace = true
tauri-plugin-notification.workspace = true
tauri-plugin-single-instance.workspace = true
tauri-plugin-updater.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
# Embeds `ui/dist` instead of loading the dev server. `tauri build` enables it
# automatically; pass `--features custom-protocol` for a plain `cargo build --release`.
custom-protocol = ["tauri/custom-protocol"]
