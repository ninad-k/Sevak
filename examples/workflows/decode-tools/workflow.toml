[[connection]]
from = "b64-decode-do"
to = "b64-decode-out"

[[connection]]
from = "url-decode"
to = "url-decode-trim"

[[connection]]
from = "url-decode-trim"
to = "url-decode-do"

[[connection]]
from = "url-decode-do"
to = "url-decode-out"

[[connection]]
from = "b64-encode-out"
to = "b64-encode-note"

[[connection]]
