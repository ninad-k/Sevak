# Type "pycron" and an expression: "pycron */15 * * * *", "pycron 30 9 * * mon-fri" or "pycron @daily".
#
# A one-shot Python plugin (Python 3.8 or newer, standard library only) that
# explains a five-field cron expression in words and lists its next five run
# times on this computer's clock. Offline; writes no files. Enter copies a row.
protocol    = 1
id          = "script:cron-explainer"
name        = "Cron explainer (Python)"
description = "pycron 30 9 * * mon-fri says in words when a cron expression runs and lists its next five runs. Offline."
keyword     = "pycron"
mode        = "oneshot"
script      = "cron.py"

# Python starts a little slower than the default 50 ms wait.
timeout_ms  = 200
