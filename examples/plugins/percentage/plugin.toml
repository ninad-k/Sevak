# Type "pct" and a percentage question: "15% of 200", "30 of 120", "80 to 100" or "200 + 15%".
#
# A one-shot Python plugin (Python 3.8 or newer, standard library only) that
# works out percentages: a percent of a number, what percent one number is of
# another, percent change, adding or subtracting a percent, discounts and bare
# decimals. Runs offline and writes no files. Enter copies the row you picked.
protocol    = 1
id          = "script:percentage"
name        = "Percentage calculator (Python)"
description = "15% of 200, 30 of 120, 80 to 100, 15% off 200: percents, changes and discounts. Offline."
keyword     = "pct"
mode        = "oneshot"
script      = "pct.py"

# Python starts a little slower than the default 50 ms wait.
timeout_ms  = 200
