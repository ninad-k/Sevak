shadow = "0 8px 28px rgba(0, 0, 0, 0.55), 0 1px 3px rgba(0, 0, 0, 0.4)"
surface = "rgba(236, 233, 251, 0.05)"
input_background = "rgba(236, 233, 251, 0.06)"
input_border = "rgba(236, 233, 251, 0.24)"
switch_off = "rgba(236, 233, 251, 0.28)"
warn = "#fbbf24"
error = "#ff8a80"
