name = "Sevak Light"
author = "Sevak"
description = "Sevak's light theme."

[font]
size = 15

[layout]
radius = 14
opacity = 100
row_height = 48
search_size = 22
icon_size = 32
window_width = 720

[light]
background = "#fcfcfd"
text = "#1c1b2e"
subtext = "#6b6a80"
border = "rgba(28, 27, 46, 0.12)"
accent = "#f59e0b"
accent_strong = "#d97706"
on_accent = "#1c1b2e"
selection = "rgba(245, 158, 11, 0.17)"
tile = "rgba(28, 27, 46, 0.06)"
kbd_background = "rgba(28, 27, 46, 0.06)"
kbd_border = "rgba(28, 27, 46, 0.14)"
shadow = "0 8px 28px rgba(28, 27, 46, 0.22), 0 1px 3px rgba(28, 27, 46, 0.12)"
surface = "rgba(28, 27, 46, 0.035)"
input_background = "#ffffff"
input_border = "rgba(28, 27, 46, 0.22)"
switch_off = "rgba(28, 27, 46, 0.26)"
warn = "#b45309"
error = "#b42318"
ok = "#15803d"
