name = "Gruvbox"
author = "Sevak"
description = "Warm, retro dark colors after the Gruvbox palette."

[font]
size = 15

[layout]
radius = 14
opacity = 100
row_height = 48
search_size = 22
icon_size = 32
window_width = 720

[dark]
background = "#282828"
text = "#ebdbb2"
subtext = "#c2b498"
border = "rgba(235, 219, 178, 0.12)"
accent = "#fabd2f"
accent_strong = "#cd9b27"
on_accent = "#282828"
selection = "rgba(250, 189, 47, 0.2)"
tile = "rgba(235, 219, 178, 0.08)"
kbd_background = "rgba(235, 219, 178, 0.08)"
kbd_border = "rgba(235, 219, 178, 0.16)"
shadow = "0 8px 28px rgba(0, 0, 0, 0.55), 0 1px 3px rgba(0, 0, 0, 0.4)"
surface = "rgba(235, 219, 178, 0.05)"
input_background = "rgba(235, 219, 178, 0.06)"
input_border = "rgba(235, 219, 178, 0.24)"
switch_off = "rgba(235, 219, 178, 0.28)"
warn = "#fabd2f"
error = "#fb6a5b"
ok = "#b8bb26"
