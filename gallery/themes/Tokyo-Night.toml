# Palette: Tokyo Night by enkia, MIT licence (https://github.com/enkia/tokyo-night-vscode-theme). Subtext lightened for AA contrast.
name = "Tokyo Night"
author = "Sevak"
description = "A calm dark blue theme after the Tokyo Night palette."

[font]
size = 15

[layout]
radius = 14
opacity = 100
row_height = 48
search_size = 22
icon_size = 32
window_width = 720

[dark]
background = "#1a1b26"
text = "#c0caf5"
subtext = "#9aa5ce"
border = "rgba(192, 202, 245, 0.12)"
accent = "#7aa2f7"
accent_strong = "#6485cb"
on_accent = "#1a1b26"
selection = "rgba(122, 162, 247, 0.2)"
tile = "rgba(192, 202, 245, 0.08)"
kbd_background = "rgba(192, 202, 245, 0.08)"
kbd_border = "rgba(192, 202, 245, 0.16)"
shadow = "0 8px 28px rgba(0, 0, 0, 0.55), 0 1px 3px rgba(0, 0, 0, 0.4)"
surface = "rgba(192, 202, 245, 0.05)"
input_background = "rgba(192, 202, 245, 0.06)"
input_border = "rgba(192, 202, 245, 0.24)"
switch_off = "rgba(192, 202, 245, 0.28)"
warn = "#e0af68"
error = "#f7768e"
ok = "#9ece6a"
