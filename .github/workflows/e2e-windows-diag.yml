# TEMPORARY: collects facts about the Windows runner's WebView2 for the
# "DevToolsActivePort file doesn't exist" e2e failure. Removed before merge.
name: e2e Windows diagnostics

on:
  push:
    branches: [fix/windows-e2e]

permissions:
  contents: read

jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Runner facts (policies, elevation, WebView2)
        shell: pwsh
        continue-on-error: true
        run: |
          whoami
          whoami /groups | Select-String -Pattern 'Mandatory Label|Administrators'
          foreach ($k in 'HKLM:\SOFTWARE\Policies\Microsoft\Edge','HKCU:\SOFTWARE\Policies\Microsoft\Edge','HKLM:\SOFTWARE\WOW6432Node\Policies\Microsoft\Edge','HKLM:\SOFTWARE\Policies\Microsoft\EdgeUpdate') {
            if (Test-Path $k) { "== $k"; Get-ChildItem -Recurse $k | ForEach-Object { $_.Name; Get-ItemProperty $_.PSPath | Format-List | Out-String } ; Get-ItemProperty $k | Format-List | Out-String } else { "== $k (absent)" }
          }
          "== WEBVIEW2_* environment"
          Get-ChildItem env: | Where-Object Name -like 'WEBVIEW2*'
          "== LOCALAPPDATA $env:LOCALAPPDATA"
          Get-ChildItem 'C:\Program Files (x86)\Microsoft\EdgeWebView\Application' -ErrorAction SilentlyContinue

      - name: Install msedgedriver matching the WebView2 runtime
        shell: pwsh
        run: |
          $client = 'Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = $null
          foreach ($key in @("HKLM:\SOFTWARE\WOW6432Node\$client", "HKLM:\SOFTWARE\$client", "HKCU:\SOFTWARE\$client")) {
            $item = Get-ItemProperty -Path $key -Name pv -ErrorAction SilentlyContinue
            if ($item -and $item.pv) { $version = $item.pv; break }
          }
          Write-Host "WebView2 runtime $version"
          $dir = Join-Path $env:RUNNER_TEMP 'msedgedriver'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $dir 'edgedriver_win64.zip'
          Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          & "$dir\msedgedriver.exe" --version
          "DRIVER=$dir\msedgedriver.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the debug app
        run: npx tauri build --debug --no-bundle

      - name: Probe a WebView2 session directly
        shell: pwsh
        continue-on-error: true
        run: |
          $prof = Join-Path $env:RUNNER_TEMP 'diag'
          $p = Start-Process node -ArgumentList @('e2e/diag/repro.mjs', $env:DRIVER, "$PWD\target\debug\sevak.exe", $prof) -PassThru -NoNewWindow
          Start-Sleep -Seconds 20
          "== processes 20 s in"
          Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'sevak|msedgewebview2|msedgedriver' } | ForEach-Object { "{0} pid={1} parent={2} session={3}`n   {4}" -f $_.Name, $_.ProcessId, $_.ParentProcessId, $_.SessionId, $_.CommandLine }
          "== EBWebView folders"
          Get-ChildItem -Recurse -Depth 1 -Filter 'EBWebView' -Directory $env:LOCALAPPDATA, "$PWD\target\debug" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName; Get-ChildItem $_.FullName | Select-Object -ExpandProperty Name }
          $p.WaitForExit(120000) | Out-Null
          Get-Process sevak, msedgewebview2 -ErrorAction SilentlyContinue | Stop-Process -Force
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\diag-out" | Out-Null
          Copy-Item "$prof\msedgedriver.log" "$env:RUNNER_TEMP\diag-out\" -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse -Filter 'chrome_debug.log' $env:LOCALAPPDATA, "$PWD\target\debug" -ErrorAction SilentlyContinue | ForEach-Object { Copy-Item $_.FullName ("$env:RUNNER_TEMP\diag-out\" + ($_.Directory.Parent.Name) + "-chrome_debug.log") }
          "== msedgedriver log (launch lines)"
          Select-String -Path "$prof\msedgedriver.log" -Pattern 'WEBVIEW2|Launching|DevTools|ERROR|SEVERE' | Select-Object -First 30 | ForEach-Object { $_.Line.Substring(0, [Math]::Min(600, $_.Line.Length)) }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diag
          if-no-files-found: ignore
          path: ${{ runner.temp }}/diag-out
