name: Release checks

# Runs the tests of the release scripts and checks that the release workflows
# are valid YAML, whenever either changes. Neither needs secrets or a build, and
# a mistake here would otherwise only show up on the next real release.

on:
  pull_request:
    paths:
      - "scripts/release-version.*"
      - "scripts/updater-manifest.*"
      - "scripts/verify-release.*"
      - "scripts/release-assets.*"
      - ".github/release.yml"
      - ".github/workflows/release*.yml"
      - ".github/workflows/promote.yml"
      - ".github/workflows/rollback.yml"
      - ".github/workflows/pr-labels.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version tests build their own repository, but keep tags handy

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test the release scripts
        run: npm run test:scripts

      - name: Parse the workflows and the release-notes config
        run: |
          python3 - <<'EOF'
          import glob, yaml
          for path in sorted(glob.glob(".github/workflows/*.yml")) + [".github/release.yml"]:
              with open(path, encoding="utf-8") as f:
                  yaml.safe_load(f)
              print("ok", path)
          EOF

      - name: Check the shell steps of the release workflows
        run: |
          python3 - <<'EOF'
          import subprocess, yaml
          failed = False
          for name in ["release", "promote", "rollback", "pr-labels"]:
              doc = yaml.safe_load(open(f".github/workflows/{name}.yml", encoding="utf-8"))
              for job, spec in doc["jobs"].items():
                  for step in spec.get("steps", []):
                      if "run" in step:
                          # GitHub's expressions are not shell, but none are used in these scripts.
                          result = subprocess.run(["bash", "-n"], input=step["run"], text=True, capture_output=True)
                          if result.returncode:
                              failed = True
                              print(f"{name}/{job}/{step.get('name')}: {result.stderr}")
          raise SystemExit(1 if failed else 0)
          EOF
