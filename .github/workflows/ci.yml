name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

# Linux packages Tauri v2 needs to compile (https://v2.tauri.app/start/prerequisites/).
# Ubuntu: used by lint-test and bundle. Fedora: used by the fedora job.

jobs:
  lint-test:
    name: Lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev

      - uses: ./.github/actions/setup-rust

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run gallery:check
      - run: npm run test:extensions
      - run: npm run build

      # Tests of the release, packaging and installer scripts, on every OS (the
      # installer is built on Windows).
      - name: Script and installer tests
        run: npm run test:scripts

      # Once is enough, so Linux only. A stale THIRD_PARTY_NOTICES.md
      # (dependencies changed, notices not regenerated) fails here: run
      # `node scripts/generate-third-party-notices.mjs`.
      - name: Third-party notices are up to date
        if: runner.os == 'Linux'
        run: node scripts/generate-third-party-notices.mjs --check

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # The project template really builds: generate one with `sevak-ext init`
      # and compile it against this checkout's SDK (the template itself names the
      # SDK by a git address, which cannot contain this change yet).
      - name: The Rust extension template builds
        shell: bash
        run: |
          cargo run -q -p sevak-ext -- init "$RUNNER_TEMP/template-check" --name template-check
          # Forward slashes: a Windows path in a TOML string would be read as escapes.
          workspace="${GITHUB_WORKSPACE//\\//}"
          sed -i.bak "s|^sevak-extension-sdk = .*|sevak-extension-sdk = { path = \"$workspace/crates/sevak-extension-sdk\" }|" "$RUNNER_TEMP/template-check/Cargo.toml"
          cargo build --release --manifest-path "$RUNNER_TEMP/template-check/Cargo.toml"

  # Unit tests of the frontend's pure TypeScript logic (Vitest; no browser, no Rust).
  ui-tests:
    name: UI unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

  # Coarse guard against catastrophic search slowdowns: the default engine over a
  # large mock index must answer typical queries in well under 100 ms (p95). Needs
  # an optimized build, so it runs here instead of in the debug `cargo test`.
  latency-budget:
    name: Search latency budget
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo test --profile fast-release -p sevak-plugins --test latency -- --nocapture

  fedora:
    name: Build and test (Fedora ${{ matrix.fedora }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora: ["43"] # keep on a currently supported release
    container:
      image: fedora:${{ matrix.fedora }}
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y \
            git tar gzip xz curl file gcc gcc-c++ make patchelf pkgconf-pkg-config \
            webkit2gtk4.1-devel libayatana-appindicator-gtk3-devel \
            openssl-devel librsvg2-devel libxdo-devel

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: cargo build --workspace
      - run: cargo test --workspace

  # The declared rust-version in Cargo.toml must really build. The pinned
  # toolchain (rust-toolchain.toml) is newer; this job proves the floor.
  msrv:
    name: MSRV check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev

      - name: Install the declared minimum Rust version
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "$msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
          rustup toolchain install "$msrv" --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: cargo check on the MSRV
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --locked

  bundle:
    name: Bundle (${{ matrix.os }})
    needs: lint-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
            artifact: sevak-windows
          - os: macos-latest
            bundles: app,dmg
            artifact: sevak-macos
          # Oldest supported Ubuntu, so the .deb and AppImage link against the
          # oldest glibc/WebKitGTK we promise to run on.
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
            artifact: sevak-linux
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev

      - uses: ./.github/actions/setup-rust

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build installers
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Verify Windows installer startup integration
        if: runner.os == 'Windows'
        run: |
          node --test scripts/installer.test.mjs scripts/installer-startup.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File scripts/test-windows-installer.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
