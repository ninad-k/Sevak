name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

# Linux packages Tauri v2 needs to compile (https://v2.tauri.app/start/prerequisites/).
# Ubuntu: used by lint-test and bundle. Fedora: used by the fedora job.

jobs:
  lint-test:
    name: Lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev

      - uses: ./.github/actions/setup-rust

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run gallery:check
      - run: npm run test:extensions
      - run: npm run build

      # Tests of the release, packaging and installer scripts, on every OS (the
      # installer is built on Windows).
      - name: Script and installer tests
        run: npm run test:scripts

      # Once is enough, so Linux only. A stale THIRD_PARTY_NOTICES.md
      # (dependencies changed, notices not regenerated) fails here: run
      # `node scripts/generate-third-party-notices.mjs`.
      - name: Third-party notices are up to date
        if: runner.os == 'Linux'
        run: node scripts/generate-third-party-notices.mjs --check

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # The project template really builds: generate one with `sevak-ext init`
      # and compile it against this checkout's SDK (the template itself names the
      # SDK by a git address, which cannot contain this change yet).
      - name: The Rust extension template builds
        shell: bash
        run: |
          cargo run -q -p sevak-ext -- init "$RUNNER_TEMP/template-check" --name template-check
          # Forward slashes: a Windows path in a TOML string would be read as escapes.
          workspace="${GITHUB_WORKSPACE//\\//}"
          sed -i.bak "s|^sevak-extension-sdk = .*|sevak-extension-sdk = { path = \"$workspace/crates/sevak-extension-sdk\" }|" "$RUNNER_TEMP/template-check/Cargo.toml"
          cargo build --release --manifest-path "$RUNNER_TEMP/template-check/Cargo.toml"

  # Unit tests of the frontend's pure TypeScript logic (Vitest; no browser, no Rust).
  ui-tests:
    name: UI unit tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

  # Coarse guard against catastrophic search slowdowns: the default engine over a
  # large mock index must answer typical queries in well under 100 ms (p95). Needs
  # an optimized build, so it runs here instead of in the debug `cargo test`.
  latency-budget:
    name: Search latency budget
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo test --profile fast-release -p sevak-plugins --test latency -- --nocapture

  fedora:
    name: Build and test (Fedora ${{ matrix.fedora }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora: ["43"] # keep on a currently supported release
    container:
      image: fedora:${{ matrix.fedora }}
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y \
            git tar gzip xz curl file gcc gcc-c++ make patchelf pkgconf-pkg-config \
            webkit2gtk4.1-devel libayatana-appindicator-gtk3-devel \
            openssl-devel librsvg2-devel libxdo-devel

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-rust

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: cargo build --workspace
      - run: cargo test --workspace

  # The declared rust-version in Cargo.toml must really build. The pinned
  # toolchain (rust-toolchain.toml) is newer; this job proves the floor.
  msrv:
    name: MSRV check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev

      - name: Install the declared minimum Rust version
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test -n "$msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
          rustup toolchain install "$msrv" --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: cargo check on the MSRV
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --locked

  bundle:
    name: Bundle (${{ matrix.os }})
    needs: lint-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
            artifact: sevak-windows
          - os: macos-latest
            bundles: app,dmg
            artifact: sevak-macos
          # Oldest supported Ubuntu, so the .deb and AppImage link against the
          # oldest glibc/WebKitGTK we promise to run on.
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
            artifact: sevak-linux
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev

      - uses: ./.github/actions/setup-rust

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build installers
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Verify Windows installer startup integration
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node --test scripts/installer.test.mjs scripts/installer-startup.test.mjs
          pwsh -NoProfile -File scripts/test-windows-installer.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

  # The real headless startup CLI on each OS, checked against the OS's own
  # artifacts: the HKCU Run/StartupApproved values on Windows, the LaunchAgent
  # plist and `launchctl print-disabled` on macOS, ~/.config/autostart on
  # Linux. Runners are throwaway, so the real per-user stores are used.
  startup-cli:
    name: Startup CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev

      - uses: ./.github/actions/setup-rust

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # The binary embeds the frontend, so it must exist before cargo builds.
      - run: npm run build
      - run: cargo build -p sevak

      - name: Exercise --set-startup / --startup-status against the real OS
        shell: bash
        run: node scripts/test-startup-cli.mjs --real-home

  # End-to-end UI tests: WebdriverIO drives the real debug app through
  # tauri-driver (https://v2.tauri.app/develop/tests/webdriver/). Linux uses
  # WebKitWebDriver under Xvfb, Windows msedgedriver matching the runner's
  # WebView2 runtime. macOS has no WKWebView driver, so it is not covered.
  e2e:
    name: End-to-end UI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    env:
      TAURI_DRIVER_VERSION: 2.1.0
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build and WebDriver dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev \
            webkit2gtk-driver xvfb dbus dbus-x11
          which WebKitWebDriver

      - name: Install msedgedriver matching the WebView2 runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $client = 'Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = $null
          foreach ($key in @("HKLM:\SOFTWARE\WOW6432Node\$client", "HKLM:\SOFTWARE\$client", "HKCU:\SOFTWARE\$client")) {
            $item = Get-ItemProperty -Path $key -Name pv -ErrorAction SilentlyContinue
            if ($item -and $item.pv) { $version = $item.pv; break }
          }
          if (-not $version) { throw 'The WebView2 runtime is not installed on this runner.' }
          Write-Host "WebView2 runtime $version"
          $dir = Join-Path $env:RUNNER_TEMP 'msedgedriver'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $zip = Join-Path $dir 'edgedriver_win64.zip'
          Invoke-WebRequest -Uri "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $driver = Join-Path $dir 'msedgedriver.exe'
          & $driver --version
          "TAURI_NATIVE_DRIVER=$driver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: ./.github/actions/setup-rust

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            e2e/package-lock.json

      - run: npm ci
      - run: npm ci --prefix e2e

      - name: Install tauri-driver
        run: cargo install tauri-driver --version ${{ env.TAURI_DRIVER_VERSION }} --locked

      # The debug app with embedded assets, as the Tauri WebDriver guide builds it.
      - name: Build the debug app
        run: npx tauri build --debug --no-bundle

      - name: Run the end-to-end suite (Linux)
        if: runner.os == 'Linux'
        env:
          SEVAK_E2E_BINARY: target/debug/sevak
          SEVAK_E2E_PROFILE: ${{ runner.temp }}/sevak-e2e
        run: dbus-run-session -- xvfb-run -a npm run test:e2e

      - name: Run the end-to-end suite (Windows)
        if: runner.os == 'Windows'
        env:
          SEVAK_E2E_BINARY: target/debug/sevak.exe
          SEVAK_E2E_PROFILE: ${{ runner.temp }}/sevak-e2e
        run: npm run test:e2e

      - name: Upload the app's logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs-${{ matrix.os }}
          if-no-files-found: ignore
          retention-days: 7
          path: ${{ runner.temp }}/sevak-e2e/data/logs
