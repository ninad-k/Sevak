name: Release

# Every push to main (i.e. every merged pull request, since main is protected
# and CI already passed on the PR) ships a new version:
#   1. plan     work out the next version from the commits since the last tag
#               (scripts/release-version.mjs) and open a draft GitHub release
#   2. build    build the installers on Windows, macOS and Linux, signed for the
#               updater, and attach them
#   3. publish  add latest.json (the update manifest installed copies poll) and
#               SHA256SUMS.txt, then publish the release, which creates the tag
#   4. distribute  update winget, Scoop, Homebrew and the AUR (each only when
#               its secret is set)
# A failed build leaves only a draft (no tag), which the next run replaces.
# Docs-only pushes don't release; nor does a head commit containing [skip release].
#
# Opt-in staged flow (docs/releasing.md): with the repository variable
# RELEASE_MODE=staged, or a manual run with channel=beta, the same pipeline
# publishes a pre-release vX.Y.Z-beta.N with latest-beta.json instead; latest.json
# and the package managers stay untouched until promote.yml publishes it as
# stable. Unset or "auto" (the default) is the behaviour described above.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/*.md"
      - ".github/dependabot.yml"
  workflow_dispatch:
    inputs:
      channel:
        description: "default = follow the RELEASE_MODE repository variable (auto = stable); beta = publish a pre-release"
        type: choice
        options: [default, stable, beta]
        default: default

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan release
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.channel.outputs.channel }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history for the version bump

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check the updater signing key is configured
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is not set; see docs/development.md (Releasing)."
            exit 1
          fi

      - name: Choose the release channel
        id: channel
        env:
          INPUT: ${{ inputs.channel }}
          RELEASE_MODE: ${{ vars.RELEASE_MODE }}
        run: |
          case "${INPUT:-default}" in
            stable | beta) channel=$INPUT ;;
            *)
              # Anything but "staged" (unset, "auto", a typo) keeps today's behaviour.
              case "$RELEASE_MODE" in
                staged) channel=beta ;;
                "" | auto) channel=stable ;;
                *)
                  echo "::warning::RELEASE_MODE='$RELEASE_MODE' is not 'auto' or 'staged'; releasing stable."
                  channel=stable
                  ;;
              esac
              ;;
          esac
          echo "Release channel: $channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Compute the next version
        id: version
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          if [ "$CHANNEL" = beta ]; then
            version=$(node scripts/release-version.mjs next-beta)
          else
            version=$(node scripts/release-version.mjs next)
          fi
          if [ -z "$version" ]; then
            echo "HEAD is already released; nothing to do."
          else
            echo "Next version: $version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create the draft release
        id: draft
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          # A draft for this tag left by an earlier failed run is replaced; a
          # published one means the tag already exists, which plan never reuses.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | [.id, .draft] | @tsv" |
          while read -r id draft; do
            if [ "$draft" = "true" ]; then
              echo "Deleting stale draft $id for $TAG"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            else
              echo "::error::Release $TAG is already published"
              exit 1
            fi
          done

          intro="Downloads for Windows, macOS and Linux are below. Installation notes: [docs/install.md](https://github.com/$GITHUB_REPOSITORY/blob/$TAG/docs/install.md). Verify downloads against \`SHA256SUMS.txt\`."
          # The maintainer can edit this section while the release is a draft.
          known=$'## Known issues and upgrade notes\n\nNone known for this release.'
          if [ "$CHANNEL" = beta ]; then
            # Only people on the beta update channel are offered a beta (Settings,
            # General, Update channel). Its notes are generated here against the
            # previous release tag, so the channel-beta pointer release (a tag
            # without a version) can never be picked as the comparison base.
            prev=$(node scripts/release-version.mjs previous-tag)
            generated=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
              ${prev:+-f previous_tag_name="$prev"} --jq .body)
            body="**Beta build.** Only people on the beta update channel are offered it; it may be less tested than a stable release."$'\n\n'"$intro"$'\n\n'"$known"$'\n\n'"$generated"
            extra=(-F prerelease=true)
          else
            body="$intro"$'\n\n'"$known"
            extra=(-F generate_release_notes=true)
          fi

          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="Sevak $TAG" \
            -f body="$body" \
            -F draft=true \
            "${extra[@]}" \
            --jq .id)
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload release assets
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis,msi --config src-tauri/tauri.release.conf.json
          - name: macOS universal
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json
          - name: Linux x64
            os: ubuntu-22.04 # oldest supported glibc, so the AppImage runs widely
            args: --bundles deb,rpm,appimage --config src-tauri/tauri.release.conf.json
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl file patchelf \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Stamp the version
        run: node scripts/release-version.mjs set ${{ needs.plan.outputs.version }}

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.plan.outputs.release_id }}
          args: ${{ matrix.args }}
          # The publish job writes latest.json once, from every platform's
          # signatures; parallel jobs updating it here could overwrite each other.
          uploadUpdaterJson: false

      - name: Verify Windows installer startup integration
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node --test scripts/installer.test.mjs scripts/installer-startup.test.mjs
          pwsh -NoProfile -File scripts/test-windows-installer.ps1

  publish:
    name: Publish release
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.plan.outputs.release_id }}
      VERSION: ${{ needs.plan.outputs.version }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download the release assets
        run: |
          mkdir release-assets # not "assets": the repository has an assets/ folder
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r id name; do
            gh api -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "release-assets/$name"
          done
          ls -l release-assets

      - name: Add latest.json and SHA256SUMS.txt
        run: |
          # A beta publishes latest-beta.json and leaves latest.json alone.
          manifest=latest.json
          if [ "$CHANNEL" = beta ]; then manifest=latest-beta.json; fi
          upload() {
            gh api -X POST -H "Content-Type: $2" --input "$1" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$(basename "$1")" \
              --jq .browser_download_url
          }
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq .body > notes.md
          node scripts/updater-manifest.mjs release-assets "$VERSION" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION" notes.md \
            --name "$manifest"
          upload "release-assets/$manifest" application/json
          (cd release-assets && sha256sum -- * > ../SHA256SUMS.txt)
          cat SHA256SUMS.txt
          upload SHA256SUMS.txt text/plain

      - name: Publish
        run: |
          if [ "$CHANNEL" = beta ]; then
            # A pre-release is never "latest", so stable users' latest.json is untouched.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -F draft=false -F prerelease=true -f make_latest=false --jq .html_url
          else
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
              -F draft=false -f make_latest=true --jq .html_url
          fi

      - name: Point the beta channel at this release
        if: env.CHANNEL == 'beta'
        run: |
          # GitHub's releases/latest/download/ shortcut skips pre-releases, so beta
          # installs read latest-beta.json from one fixed pre-release, channel-beta.
          if ! gh release view channel-beta > /dev/null 2>&1; then
            gh release create channel-beta --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Beta channel (do not download)" \
              --notes "Holds latest-beta.json, which Sevak's beta update channel reads. It always points at the newest beta; the downloads are on the vX.Y.Z-beta.N releases."
          fi
          gh release upload channel-beta release-assets/latest-beta.json --clobber

  # A release published with the default GITHUB_TOKEN does not start workflows
  # that listen for `release: published` (GitHub ignores events caused by that
  # token), so sbom.yml and attest.yml are called from here, once the stable
  # release is out. Betas are not attested or given an SBOM until promote.yml
  # publishes them as stable (it makes the same calls). The permissions below
  # are exactly what each called workflow's job declares. A failure here does
  # not undo the release; re-run just that job, or run the workflow by hand
  # for the tag (docs/security/supply-chain.md).
  sbom:
    name: Attach the SBOMs
    needs: [plan, publish]
    if: needs.plan.outputs.channel == 'stable'
    permissions:
      contents: write # upload release assets
    uses: ./.github/workflows/sbom.yml
    with:
      tag: v${{ needs.plan.outputs.version }}

  attest:
    name: Attest the installers
    needs: [plan, publish]
    if: needs.plan.outputs.channel == 'stable'
    permissions:
      id-token: write # sign the attestation with the workflow's OIDC identity
      attestations: write # store it
      contents: read
    uses: ./.github/workflows/attest.yml
    with:
      tag: v${{ needs.plan.outputs.version }}

  distribute:
    name: Update package managers
    needs: [plan, publish]
    # Betas are pre-releases and reach the package managers only when
    # promote.yml publishes them as stable.
    if: needs.plan.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    # The release is already out; a package manager that fails to update must
    # not mark it as failed. Each channel is skipped while its secret is unset
    # (see docs/development.md, "Package managers").
    continue-on-error: true
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.plan.outputs.version }}
      PACKAGING_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Render the manifests
        run: |
          gh release download "v$VERSION" --pattern SHA256SUMS.txt
          node scripts/package-manifests.mjs "$VERSION" SHA256SUMS.txt dist

      - name: Homebrew tap and Scoop bucket
        if: env.PACKAGING_TOKEN != ''
        run: |
          publish() { # <repo> <rendered file> <path in repo>
            rm -rf repo
            git clone --depth 1 "https://x-access-token:${PACKAGING_TOKEN}@github.com/$1.git" repo
            mkdir -p "repo/$(dirname "$3")"
            cp "$2" "repo/$3"
            cd repo
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$3"
            if git diff --cached --quiet; then
              echo "$1 is already at $VERSION"
            else
              git commit -m "sevak $VERSION"
              git push
            fi
            cd ..
          }
          publish ninad-k/homebrew-tap dist/homebrew/Casks/sevak.rb Casks/sevak.rb
          publish ninad-k/scoop-bucket dist/scoop/sevak.json bucket/sevak.json

      - name: AUR (sevak-bin)
        if: env.AUR_SSH_PRIVATE_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: sevak-bin
          pkgbuild: dist/aur/PKGBUILD
          commit_username: Ninad Kulkarni
          commit_email: 47207171+ninad-k@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: sevak ${{ needs.plan.outputs.version }}

      - name: winget (NinadKulkarni.Sevak)
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: NinadKulkarni.Sevak
          version: ${{ needs.plan.outputs.version }}
          release-tag: v${{ needs.plan.outputs.version }}
          installers-regex: '_x64-setup\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
