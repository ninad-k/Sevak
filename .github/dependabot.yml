# Dependency updates. Every merge to main publishes a release, so updates are
# grouped into one pull request per ecosystem per month rather than one per
# package. Security updates still arrive as soon as they are published.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # svelte-check (npm run check) declares a peer range below TypeScript 7,
      # so a major bump fails `npm ci`. Remove once svelte-check supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
