name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check the [open issues](https://github.com/ninad-k/Sevak/issues) first.
        Security problems go to a [private report](https://github.com/ninad-k/Sevak/security/advisories/new) instead.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: What part of Sevak is affected?
      options:
        - Launcher/search
        - Settings
        - Hotkey
        - Clipboard/paste
        - Snippets
        - Files/OS search
        - Plugins/Workflows
        - Themes
        - Installer/updater
        - Docs
        - Other
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. Press the Sevak shortcut (default Win+Space / Cmd+Space)
        2. Type "firefox" and press Enter
        3. Nothing starts; the window shows "..."
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Sevak version
      description: Run `sevak --version`, or see the release you downloaded.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux, X11 session
        - Linux, Wayland session
    validations:
      required: true

  - type: input
    id: os-details
    attributes:
      label: OS version and desktop
      description: For example "Windows 11 24H2", "macOS 15.1", "Ubuntu 24.04, GNOME 46".
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install Sevak?
      options:
        - Windows installer (.exe)
        - Windows MSI
        - macOS .dmg
        - .deb
        - .rpm
        - AppImage
        - Built from source
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: |
        Optional, but it usually saves a round of questions. Run `sevak --diagnostics` in a
        terminal, or open Settings → Help and choose **Copy diagnostics**, then paste the result
        here. It is made on your computer and Sevak sends nothing anywhere. It leaves out what you
        searched for, your clipboard and snippets, the contents of scripts and workflows, and
        hides your user name and home folder. **Read it before you paste it** and delete anything
        you would rather keep private.
      placeholder: Paste the report here. It is Markdown, so it will display nicely.

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Only if you did not add a diagnostics report (it already holds the last 100 log lines).
        The newest file in the logs folder: `%APPDATA%\sevak\logs\` (Windows),
        `~/Library/Application Support/sevak/logs/` (macOS) or `~/.local/share/sevak/logs/` (Linux).
        Logs can contain search text and file names; remove anything private.
      render: text

  - type: textarea
    id: config
    attributes:
      label: Relevant config
      description: The parts of `config.toml` you changed, if any.
      render: toml
