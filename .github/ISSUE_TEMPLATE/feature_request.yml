name: Feature request
description: Suggest a new feature, plugin or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or workflow, not the solution yet. "I often need to ... and today I have to ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like Sevak to do?
      description: "How it could work: what you type, what results appear, what Enter does."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds you use today, or how other launchers handle it.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to implement this myself (see CONTRIBUTING.md).
