[workspace]
resolver = "2"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Ninad Kulkarni"]
rust-version = "1.90"

[workspace.dependencies]
sevak-core = { path = "crates/sevak-core" }
sevak-platform = { path = "crates/sevak-platform" }
sevak-plugins = { path = "crates/sevak-plugins" }

anyhow = "1"
# image-data: clipboard images (read and write, all three platforms).
arboard = { version = "3", default-features = false, features = ["image-data"] }
nucleo-matcher = "0.3"
serde_json = "1"
sha2 = "0.10"
dirs = "7"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1.1"
toml_edit = { version = "0.25", features = ["serde"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
windows = "0.62"

tauri = "2"
tauri-build = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Fuzzy matching runs per keystroke; keep it fast in debug builds too.
[profile.dev.package.nucleo-matcher]
opt-level = 3
