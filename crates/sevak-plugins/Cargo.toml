[package]
name = "sevak-plugins"
description = "Sevak built-in plugins: applications, calculator, web search, file search, bookmarks and an example plugin."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
sevak-core.workspace = true
sevak-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tracing.workspace = true
# OS random bytes for the example UUID plugin (see `example_uuid`).
getrandom = "0.4"
# Reads (a private copy of) Firefox's `places.sqlite` for the bookmarks plugin.
# `bundled` compiles SQLite from source, so no system library is needed; it only
# needs the C compiler that Tauri's own build already requires.
rusqlite = { version = "0.40", features = ["bundled"] }
walkdir = "2"
