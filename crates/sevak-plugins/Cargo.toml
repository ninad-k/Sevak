[package]
name = "sevak-plugins"
description = "Sevak built-in plugins: applications, calculator and conversions, web search, file search, bookmarks, system commands, terminal commands, clipboard history, snippets, contacts, 1Password, a dictionary and an example plugin."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

# A tiny script plugin for tests/script_plugins.rs. A binary target is the one
# kind of helper cargo builds before an integration test and locates for it
# (CARGO_BIN_EXE_*), so the test needs no Python or Node.
[[bin]]
name = "sevak-script-fixture"
path = "tests/fixtures/script_fixture.rs"
test = false
doc = false

# Latency benchmark of the search engine (`cargo bench -p sevak-plugins`); see
# docs/testing.md. `harness = false`: criterion provides `main`.
[[bench]]
name = "engine_query"
harness = false

# The real-clipboard tests (ignored by default) write images the way another app would.
[target.'cfg(windows)'.dev-dependencies]
arboard.workspace = true

[dev-dependencies]
# Statistics for the latency benchmark. No plotting (the plotters tree), only the
# text output and the JSON estimates the bench workflow summarizes.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
sevak-core = { workspace = true, features = ["test-util"] }

[dependencies]
sevak-core.workspace = true
sevak-platform.workspace = true
serde.workspace = true
# serde_json: script plugins' JSON protocol, bookmarks (Chromium) and clipboard
# history files; toml: script plugin manifests; tempfile: bookmarks' private copy
# of Firefox's database.
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true
tracing.workspace = true
zeroize.workspace = true
# OS random bytes for the example UUID plugin (see `example_uuid`).
getrandom = "0.4"
# Reads (a private copy of) Firefox's `places.sqlite` for the bookmarks plugin.
# `bundled` compiles SQLite from source, so no system library is needed; it only
# needs the C compiler that Tauri's own build already requires.
rusqlite = { version = "0.40", features = ["bundled"] }
# Local date and time for snippet placeholders (no timezone database needed).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Safari's `Bookmarks.plist` for the bookmarks plugin (a binary property list;
# parsed on every OS so the reader is tested everywhere, used on macOS). Already
# in the build through the platform crate and the Tauri stack.
plist = "1"
walkdir = "2"
# Compress to .zip in the file buffer, and unpack the workflow gallery's packages
# (pure Rust; the version the updater already links, with only deflate).
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
# zip's deflate encoder is flate2, which needs one backend picked; the pure-Rust one.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Unpacks the bundled WordNet dictionary (zlib) for `define` and `spell`; pure
# Rust, already in the dependency tree through flate2 and png.
miniz_oxide = "0.8"
# Daily ECB exchange rates for the opt-in currency conversion (see `currency`).
# Same crates and TLS backend (rustls + ring) the updater already links; the
# blocking client runs on a plain background thread, never on the typing path.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Workflows: regex conditions and replacements (linear-time matching), and the
# SHA-256 behind the opt-in gallery's downloads.
regex = "1"
sha2 = "0.10"
# The gallery downloads are held to an allow-list of parsed addresses.
url.workspace = true

