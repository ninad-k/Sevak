[package]
name = "sevak-plugins"
description = "Sevak built-in plugins: applications, calculator, web search, file search and an example plugin."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

# A tiny script plugin for tests/script_plugins.rs. A binary target is the one
# kind of helper cargo builds before an integration test and locates for it
# (CARGO_BIN_EXE_*), so the test needs no Python or Node.
[[bin]]
name = "sevak-script-fixture"
path = "tests/fixtures/script_fixture.rs"
test = false
doc = false

[dependencies]
sevak-core.workspace = true
sevak-platform.workspace = true
serde.workspace = true
# Script plugins: the manifest (TOML) and the JSON protocol.
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
# OS random bytes for the example UUID plugin (see `example_uuid`).
getrandom = "0.4"
walkdir = "2"

[dev-dependencies]
tempfile.workspace = true
