[package]
name = "sevak-plugins"
description = "Sevak built-in plugins: applications, calculator, web search, file search and an example plugin."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
sevak-core.workspace = true
sevak-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# OS random bytes for the example UUID plugin (see `example_uuid`).
getrandom = "0.4"
walkdir = "2"
# Daily ECB exchange rates for the opt-in currency conversion (see `currency`).
# Same crates and TLS backend (rustls + ring) the updater already links; the
# blocking client runs on a plain background thread, never on the typing path.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[dev-dependencies]
tempfile.workspace = true
