[package]
name = "sevak-extension-sdk"
description = "Write Sevak launcher extensions in Rust: a small SDK for the script-plugin JSON protocol (results, actions, queries) with no dependencies beyond serde."
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository = "https://github.com/ninad-k/Sevak"
homepage = "https://github.com/ninad-k/Sevak"
documentation = "https://docs.rs/sevak-extension-sdk"
readme = "README.md"
keywords = ["sevak", "launcher", "extension", "plugin"]
categories = ["development-tools"]
# Publishing to crates.io is a maintainer decision (docs/writing-extensions-in-rust.md,
# "Publishing the SDK"); nothing here stops it, and nothing publishes it by itself.

[dependencies]
serde.workspace = true
serde_json.workspace = true
