[package]
name = "sevak-backup"
description = "Sevak settings backup and restore: the archive format, the allowlist of what goes in, validation and an atomic restore (no Tauri or UI code)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
sevak-core.workspace = true
sevak-platform.workspace = true
sevak-plugins.workspace = true

# Local date and time for the backup's name and the manifest (same crate and
# features the snippets plugin already uses).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
# The archive is a .zip (pure Rust, deflate only): the same crate and features
# the file buffer and the workflow gallery already use.
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
tempfile.workspace = true
