<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="290" viewBox="0 0 1440 290" role="img" aria-labelledby="title desc"><title id="title">Open, search, act</title><desc id="desc">Press Alt plus Space to open Sevak. Type an app, file, calculation or web keyword. Press Enter to launch, open or copy.</desc><rect width="1440" height="290" rx="24" fill="#1b1932"/><g font-family="Segoe UI,Arial,sans-serif"><text x="64" y="62" font-size="18" font-weight="700" fill="#f5b52c">01 / OPEN</text><text x="64" y="132" font-size="34" font-weight="700" fill="#f3f0ff">Win + Space</text><text x="64" y="188" font-size="23" fill="#aaa6c3">Bring Sevak into focus.</text></g><g font-family="Segoe UI,Arial,sans-serif"><text x="530" y="62" font-size="18" font-weight="700" fill="#f5b52c">02 / SEARCH</text><text x="530" y="132" font-size="34" font-weight="700" fill="#f3f0ff">Type what you need</text><text x="530" y="188" font-size="23" fill="#aaa6c3">Apps, files, math or web.</text></g><g font-family="Segoe UI,Arial,sans-serif"><text x="996" y="62" font-size="18" font-weight="700" fill="#f5b52c">03 / ACT</text><text x="996" y="132" font-size="34" font-weight="700" fill="#f3f0ff">Press Enter</text><text x="996" y="188" font-size="23" fill="#aaa6c3">Launch, open or copy.</text></g><path d="M449 124h28m-9-9 10 9-10 9M915 124h28m-9-9 10 9-10 9" fill="none" stroke="#f5b52c" stroke-width="3"/></svg>